name: Deploy store to GitHub Pages

# Publishes store/ (typR/registry.md §13 J6, item 1) as a GitHub Pages site. Deliberately a
# separate job from store.yml (which only checks that store/data/packages.json is fresh) — this
# one ships whatever is already committed, it never regenerates data itself.

on:
  push:
    branches: [master]
    paths:
      - "store/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: store

      - id: deployment
        uses: actions/deploy-pages@v4
